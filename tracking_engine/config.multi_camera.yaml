# Multi-camera tracking — uses camera names + rooms from ``camera_placement_plan/output/cameras_config.json``.
#
# Run from repo root:
#   python -m tracking_engine.multi_camera --config tracking_engine/config.multi_camera.yaml
#
# Laptop replay (two streams share one clip):
#   python -m tracking_engine.multi_camera --config tracking_engine/config.multi_camera.yaml \
#     --video cam_kwz_sw=clip.mp4 --video cam_kwz_nw=clip.mp4

multi_camera:
  cameras_layout_file: ../camera_placement_plan/output/cameras_config.json
  # When true (default), each RTSP uses a background grab thread that keeps only the latest frame.
  use_latest_frame_rtsp: true
  # Production deploy on the home LAN (192.168.178.0/24): seven OEM PoE cams at
  # 192.168.178.70-76, RTSP path uses inline credentials in the query string.
  #   stream=0 -> main (2880x1620, H.265)
  #   stream=1 -> sub  (704x576 PAL D1, H.264 — used for tracking on Pi 5 CPU)
  # IP -> layout-name mapping confirmed by the installer (CKiekhoefel) on
  # 2026-05-21 from the as-built positions. Re-run probe_rtsp.py + eyeball stills
  # if any camera is moved.
  #
  # Per-stream ``rotate`` (optional, one of 0/90/180/270 degrees clockwise) is
  # applied to every grabbed frame before detection AND to stills saved by
  # ``tools/probe_rtsp.py``. Use it when a camera is mounted upside-down or on
  # its side and the OEM firmware doesn't compensate. Default is 0.
  # Confirmed flipped on 2026-05-21 from probe stills:
  #   cam_yoga_ne (.71), cam_yoga_se (.70) -> rotate: 180
  #   cam_hallway_n (.74) -> rotate: 90 (sideways mount, 2026-05 client reinstall)
  streams:
    - name: cam_kwz_sw
      rtsp_url: "rtsp://192.168.178.75:554/user=admin&password=admin123&channel=1&stream=1.sdp"
      enabled: true
    - name: cam_kwz_nw
      rtsp_url: "rtsp://192.168.178.76:554/user=admin&password=admin123&channel=1&stream=1.sdp"
      enabled: true
    - name: cam_kwz_ne
      rtsp_url: "rtsp://192.168.178.72:554/user=admin&password=admin123&channel=1&stream=1.sdp"
      enabled: true
    - name: cam_kwz_se
      rtsp_url: "rtsp://192.168.178.73:554/user=admin&password=admin123&channel=1&stream=1.sdp"
      enabled: true
    - name: cam_yoga_ne
      rtsp_url: "rtsp://192.168.178.71:554/user=admin&password=admin123&channel=1&stream=1.sdp"
      enabled: true
      rotate: 180   # mounted upside-down; physical re-mount also acceptable
    - name: cam_yoga_se
      rtsp_url: "rtsp://192.168.178.70:554/user=admin&password=admin123&channel=1&stream=1.sdp"
      enabled: true
      rotate: 180   # mounted upside-down; physical re-mount also acceptable
    - name: cam_hallway_n
      rtsp_url: "rtsp://192.168.178.74:554/user=admin&password=admin123&channel=1&stream=1.sdp"
      enabled: true
      rotate: 90    # sideways mount along corridor; use probe_rtsp stills after any change

calibration_file: calibration/camera_calibrations.json
intrinsics_file: calibration/camera_intrinsics.json

# Maro floor-plan (plan-pixel calibration + zone boundaries for fusion).
# Maro runs on the same Pi as tracking (~/maro-clean, uvicorn :8420). Use loopback
# for the engine; open the UI in a browser at http://<pi-lan-ip>:8420/ (e.g. .100).
maro:
  api_base: http://127.0.0.1:8420
  assets_cache_dir: calibration/maro_cache

calibration:
  coordinate_space: maro_floorplan_px
  require_min_points: 6
  save_residual_px_max: 8.0

detector:
  backend: auto
  yolo_weights: yolov8n.pt
  hailo_hef: /usr/share/hailo-models/yolov8s_h8l.hef
  conf: 0.4
  # COCO class: 0 = person (production). 56 = chair (client demo / calibration without a person).
  class_id: 56

# One-shot LED map calibration (tools/calibrate_led_sequence.py).
auto_calibration:
  enabled: true
  led:
    marker_step: 5
    settle_ms: 400
    min_markers: 6
    save_residual_px_max: 8.0
  # Optional paths; default = maro.assets_cache_dir/strips.json + artnet_mapping.json
  # artnet_mapping can be copied from maro-light-tools/meter_test/config/artnet_mapping.json
  strips_path: null
  artnet_mapping_path: null

# Stereo foot fusion (overlap zones). Re-enable plan_fusion when stereo.enabled is true.
stereo:
  enabled: true
  pairs:
    - [cam_yoga_ne, cam_yoga_se]
  max_match_plan_px: 150.0
  max_reproj_error_px: 12.0

tracking:
  zone: unknown
  default_privacy: false
  plan_fusion:
    # Median fusion across misaligned homographies hurts stability; use stereo path first.
    enabled: true
    prefer_stereo: true
    cluster_distance_px: 80
    ema_alpha: 0.8
    ema_reset_gap_sec: 1.0
    drop_outside_zones: false    # requires HA + room polygons in Maro /api/zones
    max_speed_pxps: 1500.0
    outlier_release_after: 5
  # Suppress optical dots near SZ/BZ when thermal presence MQTT says occupied.
  thermal_gate:
    enabled: false
    boundary_buffer_px: 80.0

poster:
  # Same host as ``maro.api_base`` (Maro on Pi). Set ``dry_run: true`` and
  # ``url: http://127.0.0.1:8765/tracking/positions`` for mock_maro_server.py only.
  url: http://127.0.0.1:8420/tracking/positions
  # Thermal pipeline only; enable when Maro implements /tracking/events.
  events_url: http://127.0.0.1:8420/tracking/events
  timeout_sec: 3.0
  dry_run: false
  verify_tls: true
  include_latency_in_post: false
  # When true, one POST per tick with cam_id "fused" (median across cameras + EMA).
  fused_mode: true

# Phase C — thermal pipeline. ``python -m tracking_engine.thermal.run`` reads
# this same YAML and the ``multi_camera.cameras_layout_file`` for geometry.
thermal:
  enabled: true
  dry_run: false
  # Falls -> poster.events_url; live dots -> poster.url (override with positions_url).
  positions_url: null
  mqtt:
    host: 127.0.0.1
    port: 1883
    user: tracking
    password: Account123!@#
    topic_prefix: home
    publish_presence: true
  rooms: [SZ, BZ]
  mount_offset_mm:
    SZ: [0, 0]
    BZ: [0, 0]
  positions:
    enabled: true
    post_hz: 2.0
    ema_alpha: 0.25
    hold_sec: 2.0
    min_blob_pixels: 3
    suppress_when_door_closed: false
  detection:
    event_throttle_sec: 30.0
    body_temp_min_c: 28.0
    body_temp_max_c: 38.5
    motion_threshold_normalized: 0.02
    background_alpha: 0.02

runtime:
  show_preview: false
  # Which layout camera name to visualize when ``show_preview: true`` (must be enabled in ``streams``).
  show_preview_camera: cam_kwz_sw
  # Pi + 7 cams: one tick ≈ 15–40 s → tick=30 can take 10+ min. Use 5–10 while tuning.
  latency_log_every_n_frames: 10
  max_ticks: 0
  preview_scale: 0.5

observability:
  log_level: INFO
  log_dir: null            # null -> stderr; set e.g. /var/log/tracking-engine
  log_json: null           # null -> auto (json under systemd, console otherwise)
  metrics_enabled: false
  metrics_bind: 0.0.0.0
  metrics_port: 9100       # multi-camera tracker
  metrics_port_thermal: 9101  # thermal pipeline

# Phase A body Re-ID: SQLite + FAISS gallery, global_id on POST. Set ``enabled: true`` and install ``faiss-cpu``.
# Body embedder:
#   - Production: export OSNet via ``python tools/export_osnet_onnx.py --out tracking_engine/models/osnet_x025.onnx --quantize tracking_engine/models/osnet_x025_int8.onnx``
#     then set ``body.onnx_model_path: models/osnet_x025_int8.onnx`` (path is relative to this YAML).
#   - Dev fallback: leave ``onnx_model_path: null`` and a deterministic grayscale embedder is used
#     (not production Re-ID; the startup log will print a loud warning).
reid:
  enabled: false
  backend: sqlite_faiss
  dsn: sqlite:///reid_gallery.db
  faiss_path: reid_gallery.faiss
  tenant_id: default
  face:
    enabled: false
    detector_onnx_path: models/scrfd_500mf.onnx
    embedder_onnx_path: models/arcface_mfn.onnx
    dimension: 128
    threshold_high: 0.45
    min_face_size: 80
    min_frontal_score: 0.6
    encryption_key_path: /etc/tracking-engine/secret.key
  body:
    model_id: osnet_x025_v1
    dimension: 512
    onnx_model_path: models/osnet_x025_int8.onnx
    threshold_match: 0.35
    threshold_high: 0.20
    ema_alpha: 0.3
    top_k: 5
    min_bbox_area: 4000
    min_blur_var: 50
    min_aspect: 1.5
    max_aspect: 4.0
  gallery:
    max_prototypes_per_identity: 30
    min_quality_to_store: 0.7
    dedup_distance: 0.05
    max_writes_per_minute: 60
  fusion:
    tentative_to_confirmed_frames: 15
    conflict_grace_seconds: 5
    auto_merge_max_gap_seconds: 30
    mapping_ttl_sec: 5.0
    ema_reset_gap_sec: 2.0
